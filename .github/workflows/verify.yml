name: Clean Ubuntu verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Complete clean suite (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      GENVM_VERSION: v0.2.16
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact Node version
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.14'
      - name: Record toolchain and source identity
        run: |
          git rev-parse HEAD
          node --version
          npm --version
          python --version
          sha256sum package-lock.json requirements-dev.txt contracts/skillforge.py
      - name: Install frontend dependencies
        run: npm ci
      - name: Install contract test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Download pinned GenVM bundle
        run: genvm-lint download --version v0.2.16
      - name: Lint and validate the contract
        run: genvm-lint check contracts/skillforge.py --json
      - name: Run complete direct contract suite
        run: python -m pytest tests/direct -q
      - name: Run frontend tests
        run: npm test
      - name: Build production assets
        run: npm run build
